# Response headers for the Web App's own files (HTML, JS, CSS, fonts). Included by each static location rather than set
# once at server level: nginx drops every inherited add_header in a block that declares its own, and the /api/
# responses already carry the backend's headers.
#
# CSP matches what the build emits: one external script and one stylesheet under /assets, same-origin fonts, a `data:`
# favicon, no inline script or style, no eval. Referrer-Policy is not `no-referrer` on purpose: with it browsers send
# `Origin: null` on same-origin POSTs, which would break any origin check the API adds later.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
