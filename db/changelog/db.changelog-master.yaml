databaseChangeLog:
  # Identity (F-1): users, sessions, sign-in attempts, plus the one seeded test User.
  - include:
      file: F-1/001-users.yaml
      relativeToChangelogFile: true
  - include:
      file: F-1/002-sessions.yaml
      relativeToChangelogFile: true
  - include:
      file: F-1/003-sign-in-attempts.yaml
      relativeToChangelogFile: true
  - include:
      file: F-1/004-seed-test-user.yaml
      relativeToChangelogFile: true
  # Ledger (F-2): wallets and transactions. Schema only — no seed (every test creates its own User and Wallets),
  # and no context, so the production `prod` run applies them too.
  - include:
      file: F-2/001-wallets.yaml
      relativeToChangelogFile: true
  - include:
      file: F-2/002-transactions.yaml
      relativeToChangelogFile: true
